services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easypos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easypos_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-easypos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easypos} -d ${POSTGRES_DB:-easypos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
    environment:
      - SERVICE_FQDN_WEB
    volumes:
      - webdist:/usr/share/nginx/html
    expose:
      - "80"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-easypos}:${POSTGRES_PASSWORD:-easypos_secure_pass}@db:5432/${POSTGRES_DB:-easypos}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production}
      VAT_PCT: ${VAT_PCT:-5}
      SERVICE_PCT: ${SERVICE_PCT:-10}
      STATIC_DIR: /app/static
    volumes:
      - webdist:/app/static:ro
    expose:
      - "8000"

volumes:
  pgdata:
  webdist:
