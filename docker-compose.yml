services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easypos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easypos_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-easypos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easypos} -d ${POSTGRES_DB:-easypos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - api
    expose:
      - "80"
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.web-http.rule=Host(`crownpointofsale.online`) || Host(`www.crownpointofsale.online`)"
      - "traefik.http.routers.web-http.entrypoints=http"
      - "traefik.http.routers.web-https.rule=Host(`crownpointofsale.online`) || Host(`www.crownpointofsale.online`)"
      - "traefik.http.routers.web-https.entrypoints=https"
      - "traefik.http.routers.web-https.tls=true"
      - "traefik.http.routers.web-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"
      - "traefik.http.routers.web-http.service=web"
      - "traefik.http.routers.web-https.service=web"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-easypos}:${POSTGRES_PASSWORD:-easypos_secure_pass}@db:5432/${POSTGRES_DB:-easypos}}
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-in-production}
      VAT_PCT: ${VAT_PCT:-5}
      SERVICE_PCT: ${SERVICE_PCT:-10}
    expose:
      - "8000"
    networks:
      - default
      - coolify

volumes:
  pgdata:

networks:
  default:
  coolify:
    external: true
